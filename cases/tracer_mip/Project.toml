# Case sub-environment for the regional TRACER-MIP control.
#
# NumericalEarth (ERA5 parent, nesting, slab land, coupled fluxes) is pinned HERE rather than in the
# package environment: its weak-dependency compat forces RRTMGP 1.0.1 -> 0.22.3, which must not change
# the shared BreezeLab environment used by the ENA campaign. The package itself only declares
# NumericalEarth as a weak dependency (extension `BreezeLabNumericalEarthExt`).
#
#   julia --project=cases/tracer_mip -e 'using Pkg; Pkg.instantiate()'
#   julia --project=cases/tracer_mip data_wrangling/fetch_era5_tracer_mip.jl aug07
#   julia --project=cases/tracer_mip cases/tracer_mip.jl
[deps]
Breeze = "660aa2fb-d4c8-4359-a52c-9c057bc511da"
